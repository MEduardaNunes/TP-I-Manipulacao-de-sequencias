<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Página inicial</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class = "container">
        <div class = "item">
            <a href = "{{ url_for('home') }}">
                <button id = "botao-inicio" aria-label="Inicio">
                    <img src="{{ url_for('static', filename='icone-inicio.png') }}" alt="Inicio">
                </button>
            </a>
        </div>

        <div class = "item">
            <a href = "{{ url_for('historico') }}">
                <button id = "historico"> Histórico </button>
            </a>
        </div>

        <div class = "item">
            <a href = "{{ url_for('ajuda') }}">
                <button id = "ajuda"> Ajuda </button>
            </a>
        </div>
    </div>
    
    <div class="central">
        <h1> Máquina de Busca </h1>

        <p> Realize consultas sobre o bando de dados de
            <a href = "http://derekgreene.com/bbc/" target="_blank"> Greene e Cunningham (2006)</a>.
        </p>
        <p> Você pode realizar consultas de AND, OR e NOT sobre qualquer termo. </p>

        <form method="POST" action="{{ url_for('search_results') }}">
            <input type = "text" id = "mensagem" name = "mensagem" placeholder = "Insira sua busca aqui..." required>
            <button type = "submit"> Buscar </button>
        </form>

    </div>
</body>

</html>
