<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Documento: {{ documento.categoria }}/{{ documento.id }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
<body>
    <div class="central">
        <div class="botao-topo-wrapper">
             <button onclick="window.history.back()" title="Voltar" aria-label="Voltar" id="botao-inicio">
                 &laquo; Voltar
             </button>
        </div>

        <h1>{{ documento.categoria | capitalize }}/{{ documento.id }}</h1> 
        
        <hr>

        <div class="conteudo-documento">
            {{ documento.conteudo }}
        </div>
    </div>
</body>
</html>
